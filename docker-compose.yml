version: '3.8'

services:
  ibvapx-db:
    image: postgres:16-alpine
    container_name: ibvapx-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ibvapx_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ibvapx-app:
    build: .
    container_name: ibvapx-app
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - DATABASE_MODE=auto
      - DB_URL_POSTGRES=postgresql+psycopg://postgres:postgrespassword@ibvapx-db:5432/ibvapx_dev
      - DB_URL_SQLITE=sqlite:///./data/ibvapx_local.db
    depends_on:
      ibvapx-db:
        condition: service_healthy

volumes:
  pgdata:
